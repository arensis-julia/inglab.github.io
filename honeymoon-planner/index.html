<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iberia Honeymoon Planner</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#app{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20262f}*{box-sizing:border-box}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #ddd;background:#fff}.brand{font-weight:800}.sub{font-size:11px;color:#777}.spacer{flex:1}.pill,.btn{border:1px solid #d7d7d7;background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer}.pill.active{background:#20262f;color:#fff}.main{min-height:0;display:grid;grid-template-columns:350px 1fr}.side{border-right:1px solid #ddd;background:#fff;overflow:auto}.cityHead{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;padding:12px}.cityNav{display:flex;align-items:center;justify-content:space-between}.cityNav b{font-size:20px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}.tabs button{border:0;border-radius:7px;padding:7px;background:#f2f2f2;font-size:11px}.tabs button.active{background:#20262f;color:white}.section{padding:12px}.day{border:1px solid #e4e4e4;border-radius:9px;padding:9px;margin-bottom:7px;cursor:pointer}.day.active{border-color:#2f6c5b;box-shadow:inset 3px 0 #2f6c5b}.day small{color:#777}.place{display:grid;grid-template-columns:1fr 66px;gap:6px;border-bottom:1px solid #eee;padding:9px 0}.place b{font-size:13px}.place small{display:block;color:#777;margin-top:3px}.status{border:0;border-radius:8px;font-size:10px;font-weight:700}.must{background:#f1ddd5;color:#8b4d31}.on{background:#dfeee8;color:#2f6c5b}.saved{background:#ebe8f3;color:#65577e}.off{background:#eee;color:#777}.zone{border:1px solid #ddd;border-radius:9px;padding:10px;margin-bottom:7px}.zone b{font-size:13px}.zone small{display:block;color:#777;margin-top:4px;line-height:1.4}.presetRow{display:flex;gap:6px;margin-bottom:8px}.presetRow input{flex:1;border:1px solid #ddd;border-radius:8px;padding:7px}.preset{border:1px solid #ddd;border-radius:9px;padding:9px;margin-bottom:7px}.preset b{font-size:13px}.preset small{display:block;color:#777}.mapWrap{position:relative;min-width:0}.map{height:100%;width:100%}.floating{position:absolute;z-index:500;top:12px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #ddd;border-radius:12px;padding:8px 12px;box-shadow:0 4px 16px #0002;font-size:12px}.legend{position:absolute;z-index:500;right:12px;top:12px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px;font-size:11px}.route{font-size:11px;color:#555;line-height:1.6}.empty{color:#888;font-size:12px;padding:12px;border:1px dashed #ccc;border-radius:8px}.hotel{border:1px solid #ddd;border-radius:8px;padding:8px;margin-top:8px}.hotel.selected{border-color:#2f6c5b;background:#f2faf6}@media(max-width:800px){.main{grid-template-columns:1fr}.side{position:absolute;z-index:800;width:320px;top:58px;bottom:0;left:0;box-shadow:4px 0 16px #0002}.mapWrap{height:calc(100vh - 58px)}.sub{display:none}}</style></head><body><div id="app"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(()=>{const cities=[['lisbon','리스본',[38.7167,-9.1395],['2027-04-08','2027-04-09','2027-04-10']],['lagos','라고스',[37.1028,-8.6742],['2027-04-11','2027-04-12']],['porto','포르투',[41.1496,-8.6109],['2027-04-13','2027-04-14']],['seville','세비야',[37.3891,-5.9845],['2027-04-15','2027-04-16','2027-04-17']],['granada','그라나다',[37.1773,-3.5986],['2027-04-18','2027-04-19']],['barcelona','바르셀로나',[41.3874,2.1686],['2027-04-20','2027-04-21','2027-04-22','2027-04-23']]].map(([id,name,center,dates])=>({id,name,center,dates}));const P=(id,city,name,lat,lng,cat,def,day=0,dur=90)=>({id,city,name,lat,lng,cat,def,day,dur});const places=[P('lis-belem','lisbon','Belém / Jerónimos',38.6979,-9.2065,'관광','must',1,150),P('lis-alfama','lisbon','Alfama',38.7122,-9.1302,'동네','must',0,120),P('lis-graca','lisbon','Graça / Miradouros',38.7167,-9.1308,'전망','on',0,90),P('lis-sintra','lisbon','Sintra Day Trip',38.8029,-9.3817,'근교','saved',2,420),P('lis-baixa','lisbon','Baixa · Chiado',38.7104,-9.1414,'동네','on',1,120),P('lag-piedade','lagos','Ponta da Piedade',37.0802,-8.6699,'해안','must',1,150),P('lag-centro','lagos','Historic Centre',37.1027,-8.6748,'동네','must',0,120),P('lag-camilo','lagos','Praia do Camilo',37.0874,-8.6697,'해변','on',1,90),P('lag-ana','lagos','Praia Dona Ana',37.0913,-8.6694,'해변','on',1,75),P('opo-ribeira','porto','Ribeira',41.1409,-8.6112,'동네','must',0,120),P('opo-sb','porto','São Bento Station',41.1456,-8.6102,'관광','must',0,45),P('opo-clerigos','porto','Clérigos Tower',41.1457,-8.6149,'전망','on',1,75),P('opo-bolsa','porto','Palácio da Bolsa',41.1413,-8.6155,'관광','on',1,90),P('opo-gaia','porto','Vila Nova de Gaia',41.1382,-8.613,'동네','saved',1,120),P('svq-alcazar','seville','Real Alcázar',37.3831,-5.9902,'관광','must',1,150),P('svq-cathedral','seville','Seville Cathedral · Giralda',37.3862,-5.9926,'관광','must',1,120),P('svq-santacruz','seville','Santa Cruz',37.386,-5.9878,'동네','on',1,100),P('svq-espana','seville','Plaza de España',37.3772,-5.9869,'관광','must',2,90),P('svq-triana','seville','Triana',37.3846,-6.0037,'동네','must',2,140),P('grx-alhambra','granada','Alhambra · Generalife',37.1761,-3.5881,'관광','must',1,240),P('grx-albaicin','granada','Albaicín',37.1812,-3.5928,'동네','must',0,150),P('grx-nicolas','granada','Mirador de San Nicolás',37.181,-3.5928,'전망','must',0,60),P('grx-centro','granada','Granada Centro',37.176,-3.5985,'동네','on',0,100),P('bcn-sagrada','barcelona','Sagrada Família',41.4036,2.1744,'관광','must',1,120),P('bcn-santpau','barcelona','Sant Pau Modernista',41.411,2.1743,'관광','on',1,100),P('bcn-gracia','barcelona','Gràcia',41.4016,2.1569,'동네','must',1,130),P('bcn-guell','barcelona','Park Güell',41.4145,2.1527,'관광','on',1,120),P('bcn-gothic','barcelona','Gothic Quarter',41.3839,2.1763,'동네','must',2,150),P('bcn-born','barcelona','El Born',41.3852,2.1834,'동네','must',2,120),P('bcn-passeig','barcelona','Passeig de Gràcia',41.3918,2.1644,'쇼핑','on',0,150)];const zones={lisbon:[['Chiado / Baixa',38.7104,-9.1414,850,'균형 최상: 관광·식사·교통'],['Av. Liberdade',38.7202,-9.1452,700,'조용하고 상급 숙소 많음']],lagos:[['Historic Centre',37.1027,-8.6748,600,'도보 관광 중심'],['Marina / Station',37.108,-8.6716,550,'캐리어·교통 편리']],porto:[['Aliados / São Bento',41.1468,-8.6103,700,'핵심 관광과 교통 균형'],['Cedofeita',41.151,-8.6183,700,'조금 여유롭고 숙소 선택 폭']],seville:[['Arenal',37.3868,-5.9971,650,'주요 명소 도보권'],['Centro',37.3916,-5.9933,650,'교통·쇼핑 균형']],granada:[['Centro / Catedral',37.1763,-3.5988,600,'알함브라 이동·식사 편리'],['Realejo',37.1725,-3.596,550,'분위기 좋고 비교적 조용']],barcelona:[['Eixample / Passeig de Gràcia',41.3922,2.1649,1200,'전반적 이동·쇼핑·식사 균형'],['Eixample South',41.386,2.158,1000,'가격과 교통의 타협'] ]};const trip=[['리스본','라고스','🚆'],['라고스','포르투','🚐+✈ FAO→OPO'],['포르투','세비야','✈'],['세비야','그라나다','🚆'],['그라나다','바르셀로나','✈']];const key='honeymoonPlannerV1';let s=JSON.parse(localStorage.getItem(key)||'null')||{city:'lisbon',tab:'days',mode:'city',statuses:Object.fromEntries(places.map(p=>[p.id,p.def])),presets:[],hotels:[],selectedHotel:{}};let map,layer;const app=document.getElementById('app');const city=()=>cities.find(c=>c.id===s.city);const cityPlaces=()=>places.filter(p=>p.city===s.city);const statusOrder=['must','on','saved','off'];function save(){localStorage.setItem(key,JSON.stringify(s))}function assigned(cityId){const c=cities.find(x=>x.id===cityId),out={};c.dates.forEach(d=>out[d]=[]);places.filter(p=>p.city===cityId&&['must','on'].includes(s.statuses[p.id])).sort((a,b)=>a.day-b.day||b.dur-a.dur).forEach(p=>out[c.dates[Math.min(p.day,c.dates.length-1)]].push(p));return out}function render(){app.innerHTML=`<div class="app"><div class="top"><div><div class="brand">Iberia Honeymoon Planner</div><div class="sub">2027.04.08 LIS 12:35 → 04.23 BCN 16:15</div></div><div class="spacer"></div><button class="pill ${s.mode==='trip'?'active':''}" data-mode="trip">전체 여행</button><button class="pill ${s.mode==='city'?'active':''}" data-mode="city">도시 지도</button></div><div class="main"><aside class="side"><div class="cityHead"><div class="cityNav"><button class="btn" id="prev">‹</button><b>${city().name}</b><button class="btn" id="next">›</button></div><div class="tabs">${[['days','일정'],['places','장소'],['stay','숙소'],['presets','프리셋']].map(([k,n])=>`<button data-tab="${k}" class="${s.tab===k?'active':''}">${n}</button>`).join('')}</div></div><div class="section">${panel()}</div></aside><section class="mapWrap"><div id="map" class="map"></div><div class="floating">${s.mode==='trip'?'Lisbon → Lagos → Faro ✈ Porto → Seville → Granada → Barcelona':city().name}</div><div class="legend">● Must &nbsp; ● ON &nbsp; ○ Saved</div></section></div></div>`;bind();draw();save()}function panel(){if(s.tab==='days'){const a=assigned(s.city);return city().dates.map(d=>`<div class="day"><b>${d}</b><small>${a[d].length?'<br>'+a[d].map(p=>p.name).join(' → '):'<br>여유 / 이동 중심'}</small></div>`).join('')+`<div class="route"><b>도시간 이동</b><br>${trip.map(x=>x.join(' → ')).join('<br>')}</div>`}if(s.tab==='places')return cityPlaces().map(p=>`<div class="place"><div><b>${p.name}</b><small>${p.cat} · ${p.dur}분</small></div><button class="status ${s.statuses[p.id]}" data-place="${p.id}">${s.statuses[p.id].toUpperCase()}</button></div>`).join('');if(s.tab==='stay'){const hs=s.hotels.filter(h=>h.city===s.city);return `<div class="empty">추천 구역을 지도에 표시해두었어. 실제 숙소는 아래에서 지도 클릭으로 후보 저장 가능.</div>${zones[s.city].map(z=>`<div class="zone"><b>${z[0]}</b><small>${z[4]}</small></div>`).join('')}<button class="btn" id="pickHotel">지도에서 숙소 후보 찍기</button>${hs.map(h=>`<div class="hotel ${s.selectedHotel[s.city]===h.id?'selected':''}" data-hotel="${h.id}"><b>${h.name}</b><small>${h.lat.toFixed(4)}, ${h.lng.toFixed(4)}</small></div>`).join('')}`;return `<div class="presetRow"><input id="presetName" placeholder="예: 신트라 포함안"><button class="btn" id="savePreset">저장</button></div>${s.presets.length?s.presets.map(p=>`<div class="preset"><b>${p.name}</b><small>${p.created}</small><div style="margin-top:6px"><button class="btn" data-load="${p.id}">불러오기</button></div></div>`).join(''):'<div class="empty">프리셋을 저장하면 현재 ON/OFF와 숙소 후보가 스냅샷으로 남아.</div>'}`}function bind(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{s.mode=b.dataset.mode;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;render()});document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{let i=statusOrder.indexOf(s.statuses[b.dataset.place]);s.statuses[b.dataset.place]=statusOrder[(i+1)%4];render()});document.getElementById('savePreset')?.addEventListener('click',()=>{const n=document.getElementById('presetName').value.trim()||`일정안 ${s.presets.length+1}`;s.presets.unshift({id:crypto.randomUUID(),name:n,created:new Date().toLocaleString(),snapshot:JSON.parse(JSON.stringify({statuses:s.statuses,hotels:s.hotels,selectedHotel:s.selectedHotel}))});render()});document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const p=s.presets.find(x=>x.id===b.dataset.load);if(p){Object.assign(s,JSON.parse(JSON.stringify(p.snapshot)));render()}});document.querySelectorAll('[data-hotel]').forEach(b=>b.onclick=()=>{s.selectedHotel[s.city]=b.dataset.hotel;render()});document.getElementById('pickHotel')?.addEventListener('click',()=>{alert('지도에서 숙소 후보 위치를 클릭해줘.');s.pickHotel=true})}function move(n){let i=cities.findIndex(c=>c.id===s.city);s.city=cities[(i+n+cities.length)%cities.length].id;s.mode='city';render()}function draw(){if(map)map.remove();map=L.map('map',{zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map);if(s.mode==='trip'){map.setView([39.2,-3.5],6);const coords=cities.map(c=>c.center);L.polyline(coords,{color:'#20262f',weight:4}).addTo(layer);cities.forEach(c=>L.circleMarker(c.center,{radius:7,color:'#20262f',fillColor:'#fff',fillOpacity:1,weight:3}).addTo(layer).bindTooltip(c.name,{permanent:true,direction:'top'}).on('click',()=>{s.city=c.id;s.mode='city';render()}))}else{map.setView(city().center,city().id==='barcelona'?12:13);zones[s.city].forEach(z=>L.circle([z[1],z[2]],{radius:z[3],color:'#2f6c5b',weight:1,fillOpacity:.08}).addTo(layer).bindTooltip(z[0]));cityPlaces().filter(p=>s.statuses[p.id]!=='off').forEach(p=>{const st=s.statuses[p.id],col=st==='must'?'#a35e3e':st==='on'?'#2f6c5b':'#6d7395';L.circleMarker([p.lat,p.lng],{radius:st==='saved'?6:8,color:'#fff',weight:2,fillColor:col,fillOpacity:1}).addTo(layer).bindTooltip(`${p.name} · ${st.toUpperCase()}`)});s.hotels.filter(h=>h.city===s.city).forEach(h=>L.marker([h.lat,h.lng]).addTo(layer).bindTooltip(h.name));map.on('click',e=>{if(!s.pickHotel)return;s.pickHotel=false;const name=prompt('숙소 후보 이름을 입력해줘','Hotel candidate');if(name){const h={id:crypto.randomUUID(),city:s.city,name,lat:e.latlng.lat,lng:e.latlng.lng};s.hotels.push(h);s.selectedHotel[s.city]=h.id;render()}})}}render()})();</script></body></html>
